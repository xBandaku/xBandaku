<svg xmlns="http://www.w3.org/2000/svg" width="900" height="48" viewBox="0 0 900 48" role="img" aria-labelledby="title"><title id="title">Windows tools · Game mods · Desktop customization</title><style>.line{opacity:0;animation:cycle 12s infinite}.two{animation-delay:4s}.three{animation-delay:8s}@keyframes cycle{0%,30%{opacity:1}33%,100%{opacity:0}}@media(prefers-reduced-motion:reduce){.line{animation:none}.one{opacity:1}}</style><g fill="#56e0cd" font-family="Consolas,monospace" font-size="22" text-anchor="middle"><text class="line one" x="450" y="31">Building Windows tools that make life easier.</text><text class="line two" x="450" y="31">Game mods. Small fixes. Better workflows.</text><text class="line three" x="450" y="31">Build · Tweak · Make it yours.</text></g></svg>
