name: Refresh profile
on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/Update-Profile.ps1
      - .github/workflows/update-profile.yml
permissions:
  contents: write
concurrency:
  group: profile-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Update public activity
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/Update-Profile.ps1
      - name: Commit profile updates
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets/stats.svg
          if ! git diff --cached --quiet; then
            git commit -m "Refresh public GitHub activity"
            git push
          fi
